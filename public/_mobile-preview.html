<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>اختبار واجهة الجوال</title>
    <style>
      body { margin: 0; background: #111; display: flex; gap: 16px; padding: 16px; }
      .phone {
        width: 390px; height: 844px; border: 10px solid #333; border-radius: 40px;
        overflow: hidden; background: #000; position: relative;
      }
      iframe { width: 100%; height: 100%; border: 0; display: block; }
      .cap { color: #eee; font-family: sans-serif; font-size: 13px; text-align: center; margin-top: 6px; }
      .col { display: flex; flex-direction: column; align-items: center; }
    </style>
  </head>
  <body>
    <div class="col">
      <div class="phone"><iframe id="f" src="/referee"></iframe></div>
      <div class="cap">iPhone 12/13/14 — 390×844</div>
    </div>
    <div class="col">
      <div class="phone" style="width:360px;height:780px"><iframe id="f2" src="/referee"></iframe></div>
      <div class="cap">Android شائع — 360×780</div>
    </div>
    <div class="col">
      <div class="phone" style="width:320px;height:568px"><iframe id="f3" src="/referee"></iframe></div>
      <div class="cap">شاشة صغيرة — 320×568</div>
    </div>
  </body>
</html>
