<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <script src="/js/diag.js"></script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="" />
    <title>حروف مع حسين — جوال اللاعب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@500;700;800&display=swap"
          rel="stylesheet" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="/css/ds.css" />
  </head>
  <body class="ds ds-page" data-view="off">
    <div class="ds-phone ds-team-a" id="app">
      <header class="ds-cluster ds-cluster--between">
        <button class="ds-btn ds-btn--team" id="teamChip" type="button">
          <span data-i="users"></span>
          <span id="teamName">الفريق</span>
        </button>
        <div class="ds-cluster ds-cluster--tight">
          <button class="ds-btn ds-btn--icon" id="sfxBtn" type="button" data-sfx-toggle aria-label="كتم الأصوات">
            <svg class="ds-icon" aria-hidden="true"><use href="/icons.svg#volume" /></svg>
          </button>
          <span class="ds-pill ds-pill--dark" id="connState" data-status="connecting">
            <svg class="ds-icon" id="connIcon" aria-hidden="true"><use href="/icons.svg#timer" /></svg>
            <span id="connText">جارٍ الاتصال...</span>
          </span>
        </div>
      </header>

      <!-- شاشة الانضمام: اسم اللاعب + اختيار الفريق (صفحة /play فقط) -->
      <section class="ds-stack" id="joinView" hidden>
        <div class="ds-banner ds-banner--danger" id="joinKicked" hidden>
          <span class="ds-banner-icon"><span data-i="close"></span></span>
          <span>أخرجك الحكم من اللعبة — يمكنك الانضمام من جديد</span>
        </div>
        <form class="ds-card ds-stack" id="joinForm" autocomplete="off">
          <div class="ds-center">
            <span class="ds-badge-icon ds-badge-icon--lg"><span data-i="bell"></span></span>
            <h1 class="ds-card-title">انضمّ للعبة</h1>
          </div>
          <div class="ds-field">
            <label class="ds-label" for="joinName">اسمك</label>
            <input class="ds-input" id="joinName" maxlength="24" placeholder="اكتب اسمك هنا" enterkeyhint="done" />
          </div>
          <div class="ds-field">
            <span class="ds-label">اختر فريقك</span>
            <div class="ds-stack ds-stack--tight" id="joinTeams"></div>
          </div>
          <button class="ds-btn ds-btn--primary ds-btn--lg ds-btn--block" type="submit">
            دخول
            <span data-i="arrow"></span>
          </button>
          <p class="ds-hint ds-hint--error" id="joinNote"></p>
        </form>
      </section>

      <!-- لعبة «الكلمة الممنوعة» على جوال اللاعب -->
      <section class="ds-stack" id="tabooPhone" hidden></section>

      <!-- لعبة «في بينا غريب» على جوال اللاعب -->
      <section class="ds-stack" id="ghareebPhone" hidden></section>

      <main class="ds-stack" id="bzStage">
        <!-- الحرف المختار (يظهر دائماً أثناء اختيار الحرف، حتى قبل كشف السؤال) -->
        <section class="ds-letterbar" id="letterBar" hidden>
          <span>الحرف المختار</span>
          <b id="letterBarValue">؟</b>
        </section>

        <!-- بطاقة السؤال (تظهر بعد كشف الحكم فقط) -->
        <section class="ds-qpanel" id="bzQuestion" hidden>
          <div class="ds-hex ds-letter-badge is-selected">
            <div class="ds-hex-in"><div class="ds-hex-face"><span class="ds-hex-letter" id="qLetter">أ</span></div></div>
          </div>
          <div class="ds-qpanel-text" id="qText"></div>
        </section>

        <!-- العنصر المركزي: الزر أو العدّاد أو النتيجة -->
        <section class="ds-center" id="bzCenter" data-state="idle">
          <div class="ds-ring" id="bzRing" hidden>
            <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="ds-ring-bg" cx="50" cy="50" r="46" /><circle class="ds-ring-fg" cx="50" cy="50" r="46" /></svg>
            <span class="ds-ring-num" id="ringNum">15</span>
          </div>
          <p class="ds-text ds-text--dim" id="ringSub" hidden>ثانية</p>
          <div class="ds-center" id="centerBody">
            <span class="ds-badge-icon ds-badge-icon--lg" id="centerBadge">
              <svg class="ds-icon" id="centerIcon" aria-hidden="true"><use href="/icons.svg#volume-off" /></svg>
            </span>
            <h2 class="ds-title ds-title--sm" id="centerTitle">الأجراس متوقفة</h2>
            <p class="ds-text ds-text--dim" id="centerSub">سيُفتح الضغط من الحكم</p>
          </div>
          <button class="ds-buzzer" id="buzzPad" type="button" hidden>
            <svg class="ds-icon" id="hitIcon" aria-hidden="true"><use href="/icons.svg#bell" /></svg>
            <span id="hitLabel">اضغط الآن!</span>
          </button>
        </section>

        <div class="ds-banner ds-banner--info" id="buzzBanner" hidden>
          <span class="ds-banner-icon"><svg class="ds-icon" id="bannerIcon" aria-hidden="true"><use href="/icons.svg#info" /></svg></span>
          <span id="bannerText"></span>
        </div>
        <div class="ds-center">
          <span class="ds-answer" id="bzAnswer" hidden><span data-i="check"></span><span id="bzAnswerText"></span></span>
        </div>
        <p class="ds-text ds-text--dim ds-center" id="buzzNote">أول ضغطة فقط تُحتسب</p>
        <div class="ds-center"><span class="ds-pill ds-pill--dark" id="myStats" hidden></span></div>
      </main>
    </div>

    <script type="module" src="/js/buzzer.js"></script>
  </body>
</html>
