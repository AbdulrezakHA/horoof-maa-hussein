<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>مواضيع «الكلمة الممنوعة»</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/base.css" />
    <style>
      body { margin: 0; font-family: "Tajawal", sans-serif; background: #14112a; color: #fff; }
      .wrap { max-width: 900px; margin: 0 auto; padding: 1rem; }
      h1 { font-size: 1.5rem; margin: 0.4rem 0 1rem; }
      .packs { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 0.6rem; }
      .pack { padding: 0.8rem; border-radius: 16px; border: 2px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); color: inherit; font: inherit; cursor: pointer; text-align: start; }
      .pack.active { border-color: #ffd93d; background: rgba(255,217,61,.12); }
      .pack b { display: block; font-size: 1.05rem; }
      .pack small { opacity: .75; }
      .editor { margin-top: 1rem; display: grid; gap: 0.6rem; }
      .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
      input, textarea { font: inherit; color: inherit; background: rgba(0,0,0,.3); border: 2px solid rgba(255,255,255,.2); border-radius: 12px; padding: 0.6rem 0.8rem; }
      input.icon { width: 4.5rem; text-align: center; font-size: 1.3rem; }
      input.name { flex: 1 1 200px; }
      textarea { width: 100%; box-sizing: border-box; min-height: 55vh; line-height: 1.8; font-size: 1rem; direction: rtl; }
      .btn { padding: 0.6rem 1rem; border-radius: 12px; border: 2px solid rgba(255,255,255,.2); background: rgba(255,255,255,.1); color: inherit; font: 800 0.95rem inherit; cursor: pointer; }
      .btn.primary { background: #ffd93d; color: #111; border-color: #111; }
      .btn.danger { border-color: #ef4444; }
      .hint { opacity: .8; font-size: .9rem; line-height: 1.7; }
      .status { min-height: 1.4em; font-weight: 800; color: #ffd93d; }
      .warn { color: #fca5a5; font-size: .85rem; white-space: pre-line; }
      code { background: rgba(255,255,255,.1); padding: 0 .3em; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>🚫 مواضيع «الكلمة الممنوعة»</h1>
      <div class="packs" id="packs"></div>
      <div class="row" style="margin-top: 0.8rem">
        <button class="btn" id="newBtn" type="button">➕ موضوع جديد</button>
      </div>

      <section class="editor" id="editor" hidden>
        <div class="row">
          <input class="icon" id="icon" maxlength="4" title="أيقونة الموضوع" />
          <input class="name" id="name" maxlength="60" placeholder="اسم الموضوع" />
        </div>
        <p class="hint">
          كل سطر بطاقة: <code>الكلمة | ممنوعة، ممنوعة، ممنوعة…</code> — عدد الكلمات الممنوعة حرّ (٣ إلى ٨).
          لا تكتب ضمن الممنوعة جزءاً من الكلمة نفسها (فهو ممنوع أصلاً).
        </p>
        <textarea id="text" spellcheck="false"></textarea>
        <div class="row">
          <button class="btn primary" id="saveBtn" type="button">💾 حفظ</button>
          <button class="btn danger" id="deleteBtn" type="button">🗑 حذف الموضوع</button>
          <span class="status" id="status"></span>
        </div>
        <div class="warn" id="warn"></div>
      </section>
    </div>

    <script type="module">
      const $ = (id) => document.getElementById(id);
      let packs = [];
      let current = null; // اسم الموضوع المفتوح (null = جديد)

      async function api(path, body) {
        const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : undefined);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "خطأ");
        return data;
      }

      async function loadList() {
        packs = (await api("/api/taboo/packs")).packs;
        const box = $("packs");
        box.replaceChildren();
        for (const p of packs) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "pack" + (p.id === current ? " active" : "");
          b.innerHTML = `<b></b><small></small>`;
          b.querySelector("b").textContent = `${p.icon} ${p.name}`;
          b.querySelector("small").textContent = `${p.total} بطاقة${p.warnings ? ` · ⚠️ ${p.warnings}` : ""}`;
          b.addEventListener("click", () => open(p.id));
          box.appendChild(b);
        }
      }

      async function open(id) {
        const data = await api(`/api/taboo/get?id=${encodeURIComponent(id)}`);
        current = id;
        $("editor").hidden = false;
        $("icon").value = data.icon || "🃏";
        $("name").value = id;
        $("text").value = data.cards.map((c) => `${c.word} | ${c.forbidden.join("، ")}`).join("\n");
        $("warn").textContent = (data.warnings || []).join("\n");
        $("status").textContent = "";
        loadList();
      }

      /** «الكلمة | ممنوعة، ممنوعة» ← صيغة الملف (أعمدة مفصولة بـ TAB). */
      function toTsv(text) {
        return text
          .split(/\r?\n/)
          .map((line) => {
            const [word, rest = ""] = line.split("|");
            const forb = rest.split(/[،,]/).map((x) => x.trim()).filter(Boolean);
            return [word.trim(), ...forb].join("\t");
          })
          .filter((l) => l.trim())
          .join("\n");
      }

      $("saveBtn").addEventListener("click", async () => {
        const name = $("name").value.trim();
        if (!name) return ($("status").textContent = "اكتب اسم الموضوع");
        try {
          const saved = await api("/api/taboo/save", { id: name, icon: $("icon").value.trim(), text: toTsv($("text").value) });
          if (current && current !== name) await api("/api/taboo/delete", { id: current });
          current = name;
          $("status").textContent = `✅ حُفظ — ${saved.cards.length} بطاقة`;
          $("warn").textContent = (saved.warnings || []).join("\n");
          loadList();
        } catch (e) {
          $("status").textContent = "❌ " + e.message;
        }
      });

      $("deleteBtn").addEventListener("click", async () => {
        if (!current || !confirm(`حذف الموضوع «${current}» نهائياً؟`)) return;
        await api("/api/taboo/delete", { id: current });
        current = null;
        $("editor").hidden = true;
        loadList();
      });

      $("newBtn").addEventListener("click", () => {
        current = null;
        $("editor").hidden = false;
        $("icon").value = "🃏";
        $("name").value = "";
        $("text").value = "";
        $("warn").textContent = "";
        $("status").textContent = "اكتب اسم الموضوع ثم البطاقات، واضغط «حفظ»";
        $("name").focus();
      });

      loadList();
    </script>
  </body>
</html>
